<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="A browser extension to look up medication information including uses, side effects, and interactions.">
    <meta name="author" content="L.Hudley">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/popup.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=search" />
    <title>MedLookup</title>
</head>
<body>
    <div class="container">
        <div class="nav">
        
            <img src="rxlogo.png" class="logo" alt="logo">
            
        </div>
        <main>
            <form  class="searchbar">
                <div class="search">
                    <span id="search-icons" class="search-icon material-symbols-outlined">search</span>
                    <input id="medQuery" class="search-input" type = "search" placeholder="Search" >
                </div>
            </form>

            <div id="status" class="status">Enter a drug name and press Enter </div>
        
            <div id="resultRx" class="sections general-info result hidden" aria-live="polite">
                <p class="gen-row"  id="drug-class">
                    <strong>RxCui: </strong><span id="rxcui"></span>
                </p>
                <p class="gen-row" id="generic-name">
                    <strong>Generic Name: </strong><span id="generic"></span>
                </p>
                <p class="gen-row" id="brand-name">
                    <strong>Brand Name: </strong><span id="synonym"></span>
                </p>
                <p class="gen-row" id="class-name">
                    <strong>Clinical Drug Class: </strong><span id="drugClass"></span>
                </p>
                
            </div>


            <div id="resultUse" class=" sections med-uses result hidden">
                <p class= "use-row" ><strong>Clinical Description:</strong>
                    <span id="usageText"></span>
                </p>
                <p class= "use-row" ><strong>Simple Description:</strong>
                    <span id="simpleUsageText"></span>
                </p>
            </div>

            <a href="https://www.rxlookupz.com" target="_blank" class="extension-link">
            Visit Top Prescribed Medications →
            </a>

            <div id="error" class="error hidden"></div>
        </main>
        <footer class="footer">
            <small class="footer-text">Data from RxNav (RXNorm), OpenFDA and Wikipedia</small>
        </footer>
    </div>
</body>
<script src="./scripts/popup.js"></script>
</html>
